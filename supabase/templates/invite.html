<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:0;background:#f6f1e7;font-family:Georgia,'Times New Roman',serif;color:#2f3d33;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f1e7;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#fffdf8;border-radius:16px;padding:36px 32px;">
            <tr>
              <td>
                <p style="margin:0 0 6px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#7b9a7e;">Le Cocon</p>

                </p>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#8a948c;font-family:Arial,Helvetica,sans-serif;">
